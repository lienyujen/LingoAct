name: Release desktop builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (a new tag is created at the selected workflow revision)'
        required: true
      publish:
        description: 'Publish to the release page (off = build only, so a Mac build can be opened before it goes public)'
        type: boolean
        default: false
      refresh:
        description: 'Rebuild every download for this release from the selected revision'
        type: boolean
        default: false
      platform:
        description: 'Build every platform, or refresh the macOS downloads'
        type: choice
        options:
          - all
          - mac
        default: all
      edition:
        description: 'Choose all editions or a specific teaching edition'
        type: choice
        options:
          - all
          - languages
          - english
          - japanese
          - guoyu
          - mandarin
        default: all

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare draft release
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Create draft before uploading checked builds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
          REFRESH: ${{ inputs.refresh }}
          EDITION: ${{ inputs.edition }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          if [[ "$REFRESH" == "true" && ( ( "$EDITION" != "all" && "$EDITION" != "languages" ) || "$PLATFORM" != "all" ) ]]; then
            echo "::error::Moving the release tag requires rebuilding every download."
            exit 1
          fi
          if ! gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "LingoAct $TAG" --notes "Builds are being verified."
          fi

  build:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Neither platform is worth publishing on its own, but one failing should
      # still leave the other downloadable rather than cancelled.
      fail-fast: false
      matrix:
        include:
          - label: Windows SC
            os: windows-latest
            profile: sc
            product: LingoAct-SC
            target: --win zip --x64
            artifact: LingoAct-SC.zip
          - label: macOS SC
            os: macos-latest
            profile: sc
            product: LingoAct-SC
            target: --mac dmg --universal
            artifact: LingoAct-SC.dmg
          - label: Windows Huayu
            os: windows-latest
            profile: huayu
            product: LingoAct-Huayu
            target: --win zip --x64
            artifact: LingoAct-Huayu.zip
          - label: Windows Full
            os: windows-latest
            profile: full
            product: LingoAct
            target: --win zip --x64
            artifact: LingoAct-Full.zip
          - label: Windows Japanese
            os: windows-latest
            profile: japanese
            product: LingoAct-JP
            target: --win zip --x64
            artifact: LingoAct-JP.zip
          - label: macOS Japanese
            os: macos-latest
            profile: japanese
            product: LingoAct-JP
            target: --mac dmg --universal
            artifact: LingoAct-JP.dmg
          - label: Windows English
            os: windows-latest
            profile: english
            product: LingoAct-English
            target: --win zip --x64
            artifact: LingoAct-English.zip
          - label: macOS English
            os: macos-latest
            profile: english
            product: LingoAct-English
            target: --mac dmg --universal
            artifact: LingoAct-English.dmg
          - label: Windows TC
            os: windows-latest
            profile: ncacls
            product: LingoAct-TC
            target: --win zip --x64
            artifact: LingoAct-TC.zip
          - label: Windows Guoyu
            os: windows-latest
            profile: guoyu
            product: LingoAct-Guoyu
            target: --win zip --x64
            artifact: LingoAct-Guoyu.zip
          - label: macOS Guoyu
            os: macos-latest
            profile: guoyu
            product: LingoAct-Guoyu
            target: --mac dmg --universal
            artifact: LingoAct-Guoyu.dmg
          - label: macOS Huayu
            os: macos-latest
            profile: huayu
            product: LingoAct-Huayu
            target: --mac dmg --universal
            artifact: LingoAct-Huayu.dmg
          - label: macOS TC
            os: macos-latest
            profile: ncacls
            product: LingoAct-TC
            target: --mac dmg --universal
            artifact: LingoAct-TC.dmg
    steps:
      - name: Checkout
        if: (github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest') && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (inputs.publish && !inputs.refresh && inputs.tag) || github.sha }}

      - name: Setup pnpm
        if: (github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest') && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          # In step with the workflows and Cloudflare Pages: this repository's
          # lockfile is a pnpm 11 one.
          version: 11.7.0

      - name: Setup Node
        if: (github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest') && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: (github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest') && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        run: pnpm install --frozen-lockfile

      # 17 MB of binary deliberately kept out of git, and named in
      # extraResources — so without this the packaging step fails outright
      # looking for resources/fonts, and it is the注音 every Chinese class uses.
      - name: Fetch the Bopomofo font
        if: (github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest') && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        run: node scripts/fetch-bopomofo-font.mjs

      # pnpm lint starts with tsc -b and runs the schema checks. The schema ones
      # matter most here: the whole of schema.sql is handed to Postgres as one
      # transaction, so a single fault anywhere in it leaves whoever downloads
      # this with a project that has no tables and a setup screen that only says
      # 建立資料表失敗.
      - name: Lint, typecheck and check the schema
        if: (github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest') && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        run: pnpm lint

      # Deliberately built with no Supabase project configured: whoever downloads
      # this enters their own on first launch. Baking one in would send every
      # class to that project and bill its owner for everyone's AI usage.
      - name: Build
        if: (github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest') && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        run: pnpm build

      - name: Check classroom synchronization and teaching regressions
        if: (github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest') && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        run: pnpm test:offline

      # The build above is only credential-free because no .env reaches the runner.
      # Check the bundle rather than trust that, so a committed .env fails the
      # release instead of shipping one person's project to everyone who downloads it.
      - name: Verify no project is baked in
        if: (github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest') && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        shell: bash
        run: |
          # Matches a real key, not the setup screen's own placeholder and
          # validation pattern, which legitimately contain the same prefix.
          if grep -rhoE 'sb_publishable_[A-Za-z0-9_-]{20,}' dist/assets | grep -q .; then
            echo "::error::A Supabase publishable key is embedded in the build. Refusing to publish."
            grep -rhoE 'sb_publishable_[A-Za-z0-9_-]{20,}' dist/assets | sed 's/\(.\{22\}\).*/\1.../' | sort -u
            exit 1
          fi
          echo "No Supabase project embedded."

      # One profile per job, as in InterAct's known-good Mac build. Building
      # Huayu and then NCACLS in the same release/mac-universal directory meant
      # only the second app was ever inspected; a bad Huayu DMG could therefore
      # be published beside a perfectly valid NCACLS one.
      - name: Package ${{ matrix.product }}
        if: (github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest') && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        shell: bash
        env:
          APP_PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.target }}
          VITE_APP_PROFILE: ${{ matrix.profile }}
        run: |
          pnpm build
          pnpm exec electron-builder $TARGET --publish never

      - name: Distinguish the full edition download
        if: (matrix.profile == 'full' && (github.event_name == 'push' || inputs.platform == 'all')) && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        shell: bash
        run: mv release/LingoAct.zip release/LingoAct-Full.zip

      - name: Verify the Windows app starts
        if: (matrix.os == 'windows-latest' && (github.event_name == 'push' || inputs.platform == 'all')) && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        env:
          PRODUCT: ${{ matrix.product }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          import assert from 'node:assert/strict'
          const output = execFileSync(`release/win-unpacked/${process.env.PRODUCT}.exe`, ['--smoke-test'], { encoding: 'utf8', timeout: 30000, windowsHide: true })
          assert.match(output, /LINGOACT_SMOKE_TEST_OK/)
          console.log(output)
          JS

      # Check the exact app and image this job uploads. Besides the signature,
      # invoking --version makes macOS load the universal executable; lipo by
      # itself only proves both slices exist, not that the kernel accepts them.
      - name: Verify the Mac app and DMG
        if: (matrix.os == 'macos-latest' && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'mac')) && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          app="release/mac-universal/$PRODUCT.app"
          dmg="release/$PRODUCT.dmg"
          codesign --display --verbose=2 "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "Architectures:"
          archs=$(lipo -archs "$app/Contents/MacOS/$PRODUCT")
          echo "$archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          # An Electron app owns --version itself and may enter its GUI loop.
          # Node mode still makes macOS load this exact universal Mach-O, then
          # exits deterministically after proving the embedded runtime starts.
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/$PRODUCT" -e \
            'console.log(`Electron runtime: ${process.versions.electron}; arch: ${process.arch}`)'
          # Node mode proves the Mach-O starts but deliberately skips
          # electron/main.cjs. Launch the packaged application as Electron too:
          # this caught the Windows-only BrowserWindow.setAppDetails call that
          # made both v1.0.5 DMGs pass packaging and then crash on a real Mac.
          "$app/Contents/MacOS/$PRODUCT" --smoke-test
          hdiutil verify "$dmg"
          # Without these two strings macOS denies the microphone and the screen
          # outright, and the app looks broken rather than unapproved.
          # PlistBuddy exits non-zero on a missing key, so a dropped extendInfo
          # fails here instead of on someone's Mac.
          echo "Usage descriptions:"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSScreenCaptureUsageDescription' "$app/Contents/Info.plist"

      - name: Upload build
        if: (!inputs.refresh && (github.event_name == 'push' || inputs.publish) && (github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest')) && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT: ${{ matrix.artifact }}
        shell: bash
        run: |
          test -f "release/$ARTIFACT"
          gh release upload "$TAG" "release/$ARTIFACT" --clobber

      - name: Save a build for preview or release refresh
        if: (github.event_name == 'workflow_dispatch' && (!inputs.publish || inputs.refresh) && (inputs.platform == 'all' || matrix.os == 'macos-latest')) && (inputs.edition != 'languages' || matrix.profile != 'full') && (inputs.edition != 'english' || matrix.profile == 'english') && (inputs.edition != 'japanese' || matrix.profile == 'japanese') && (inputs.edition != 'guoyu' || matrix.profile == 'guoyu') && (inputs.edition != 'mandarin' || contains(fromJSON('["huayu","sc","ncacls"]'), matrix.profile))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.label }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    permissions:
      actions: read
      contents: write
    needs: build
    # Pushing a tag publishes, as before. A manual run defaults to building
    # only, so an unsigned Mac build can be downloaded and actually opened on a
    # Mac before it goes onto the public release page.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
          EDITION: ${{ inputs.edition || 'all' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          REFRESH: ${{ inputs.refresh }}
        shell: bash
        run: |
          if [[ "$REFRESH" == "true" ]]; then
            gh run download "$GITHUB_RUN_ID" --dir artifacts
            mkdir builds
            for artifact in artifacts/*/*; do
              mv "$artifact" builds/
            done
            expected=(LingoAct-{SC,Huayu,JP,English,TC,Guoyu}.{dmg,zip})
            if [[ "$EDITION" == "all" ]]; then
              expected+=(LingoAct-Full.zip)
            else
              release_assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
              if [[ -n "$release_assets" ]] && ! diff -q                 <(printf '%s\n' "$release_assets" | sed '/^SHA256SUMS\.txt$/d' | sort)                 <(printf '%s\n' "${expected[@]}" | sort); then
                echo "::error::Refresh must cover every published package."
                exit 1
              fi
            fi
            for name in "${expected[@]}"; do
              test -s "builds/$name"
            done
            # Wait for every build to pass before changing the published source
            # or downloads. A fast-forward preserves the tag's release history.
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f "sha=$GITHUB_SHA" -F force=false
            gh release upload "$TAG" "${expected[@]/#/builds/}" --clobber
          else
            gh release download "$TAG" --dir builds --pattern '*.zip' --pattern '*.dmg'
          fi
          if [[ "$PLATFORM" == "all" && ( "$EDITION" == "all" || "$EDITION" == "languages" ) ]]; then
            for name in LingoAct-{SC,Huayu,JP,English,TC,Guoyu}.{dmg,zip}; do
              test -s "builds/$name"
            done
          fi
          (cd builds && shopt -s nullglob && sha256sum -- *.zip *.dmg > SHA256SUMS.txt)
          notes=$(cat <<'MD'
          ## 下載

          | 版本 | Windows | macOS |
          |---|---|---|
          | LingoAct-SC 簡體中文／HSK 版 | `LingoAct-SC.zip` | `LingoAct-SC.dmg` |
          | 華語教學版（預設繁體，可選簡體或 English） | `LingoAct-Huayu.zip` | `LingoAct-Huayu.dmg` |
          | 完整教學版 | `LingoAct-Full.zip` | — |
          | 日語教學版 | `LingoAct-JP.zip` | `LingoAct-JP.dmg` |
          | 英語教學版 | `LingoAct-English.zip` | `LingoAct-English.dmg` |
          | 繁體中文版（TC） | `LingoAct-TC.zip` | `LingoAct-TC.dmg` |
          | 國語教學版 | `LingoAct-Guoyu.zip` | `LingoAct-Guoyu.dmg` |

          **Windows：** 解壓縮後執行裡面的 exe。
          **macOS：** 開啟 dmg，把 App 拖進「應用程式」。同一個檔案支援 Apple Silicon 與 Intel。

          ## 本次更新

          - 口語表達與朗讀新增 5 分鐘作答選項，支援完整錄音上傳。
          - 截圖問答題可在提示指定翻譯語言及評分標準。普通問答題也可開啟 AI 評分。學生交卷後可查看分數和回饋，成績依現有測驗比例計入課堂總分。
          - 「下一步教學」只留一個「重新做一次」。按下即重派原題，保留上一輪的作答紀錄。
          - 修正華語等版本的 Exit Ticket 派送問題。
          - 字詞卡使用純文字。可作答的卡片先顯示，發音在背景準備，進入複習才載入直譯。
          - 卡背並列直接詞義與完整解釋。新標音的華語字詞卡遵循漢語拼音正詞法。
          - 正體字詞卡提供教育部筆順連結與手寫檢查，涵蓋華語、TC 和國語的正體字課程。
          - 使用自有 Supabase 的教師請用新版部署精靈更新後端。

          - 各桌面版保留教師主選單的分格卡片並縮短間距。未交人數顯示於進行中分頁內，交齊或停止收件就隱藏。錄音參考計時在作答卡片內顯示，到零會自動收起。
          - 教師手寫題目、提示及派送文字可保留多語原文。英文課可把多語素材轉成符合班級程度的英文題目、文章與聽力對話。
          - 英文課合成朗讀及對話預設美式，選擇英式會使用英式語系設定。舊安裝請重跑後端部署精靈以套用多語輸入和口音設定。
          - 「下一步教學」可重新派出同一題並保留上一輪紀錄。
          - 擋下無聲或不完整的錄音，辨識不到語音時不計分。
          - 口說與朗讀在 AI 完成分析後立即顯示評測，教師可在收件期間播放錄音；停止作答只阻止新提交。
          - 每題朗讀可提交兩次，保留第一次錄音及評語，並顯示兩次分數；同一學員不會重複計入作答人數。
          - 閱讀測驗延長生成時限；長文拼音分段處理並保留上下文，完整拼音可直接沿用，避免重複 AI 呼叫。
          - 修正簡體模式的生成失敗訊息，並區分超時與服務限額。
          - 舊後端需用新版部署精靈重新部署，才能啟用兩次朗讀與即時評測；本次資料變更保留既有錄音。
          每個發布版本均執行型別、資料表、離線回歸與啟動檢查；macOS 另外驗證簽章、雙架構及 DMG。
          SHA256SUMS.txt 提供下載檔案的 SHA-256 校驗值。

          ## 首次使用

          開啟後會出現設定畫面，填入你自己的 Supabase 專案（專案識別碼與 publishable key），
          再展開「還沒建立後端？讓 LingoAct 幫你部署」，按一次自動部署就會建好資料表與 AI 功能。

          學員端網址留空就好 —— QR Code 會自動帶上你的專案，課堂資料只會進你自己的 Supabase。

          尚未建立 Supabase 專案，可直接依程式內的部署精靈操作。

          ## 注意

          執行檔未經程式碼簽章。Windows SmartScreen 可能顯示「不明發行者」，
          請點「其他資訊 → 仍要執行」；macOS 第一次開啟請在「系統設定 → 隱私權與安全性」按「仍要開啟」。
          部分公司電腦的資安政策可能直接封鎖。

          個人與教育用途免費；補習班、企業內訓與收費課程屬商業用途，
          使用教學與完整授權：https://lingoact.ehuayu.org/about。
          MD
          )
          if [[ "$EDITION" == "languages" ]]; then
            notes=$(printf '%s\n' "$notes" | sed '/| 完整教學版 |/d')
          fi
          if [[ "$EDITION" == "mandarin" ]]; then
            notes=$(printf '%s\n' "$notes" | sed '/| 完整教學版 |/d; /| 英語教學版 |/d; /| 日語教學版 |/d; /| 國語教學版 |/d')
          fi
          if [[ "$EDITION" == "english" ]]; then
            notes=$(cat <<'MD'
          ## LingoAct English

          - The desktop workspace keeps separate cards with tighter spacing. The Current tab shows a small pending count until all responses arrive or collection stops. The recording reference timer stays inside its activity card and clears at zero.
          - Teacher-written questions, directions and messages accept multilingual text. AI activities adapt source material into English at the selected class level.
          - Listening can adapt pasted source text into an editable English passage or dialogue. Speech synthesis requests American English by default or British English when selected.

          Existing installations need to run the backend deployment wizard again to enable the updated Edge Functions.

          On macOS, open `LingoAct-English.dmg` and drag the app into Applications. The DMG supports Apple Silicon and Intel.
          MD
            )
            if [[ "$PLATFORM" == "all" ]]; then
              notes=$(printf '%s\n\n%s' "$notes" 'On Windows, extract `LingoAct-English.zip` and run the included executable.')
            fi
            notes=$(printf '%s\n\n%s' "$notes" 'Use `SHA256SUMS.txt` to verify the downloads.')
          fi
          latest=true
          if [[ "$EDITION" == "english" ]]; then
            latest=false
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A same-version rebuild is intentional: replace only the assets
            # produced by this run and leave the other platform untouched.
            gh release upload "$TAG" builds/SHA256SUMS.txt --clobber
            printf '%s\n' "$notes" > release-notes.md
            gh release edit "$TAG" --draft=false --latest="$latest" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "LingoAct $TAG" \
              --latest="$latest" \
              --notes "$notes" \
              builds/*
          fi
