name: Release desktop builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist)'
        required: true
      publish:
        description: 'Publish to the release page (off = build only, so a Mac build can be opened before it goes public)'
        type: boolean
        default: false
      platform:
        description: 'Build every platform, or refresh only the two macOS downloads'
        type: choice
        options:
          - all
          - mac
        default: all

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Neither platform is worth publishing on its own, but one failing should
      # still leave the other downloadable rather than cancelled.
      fail-fast: false
      matrix:
        include:
          - label: Windows SC
            os: windows-latest
            profile: sc
            product: LingoAct
            target: --win zip --x64
            artifact: LingoAct.zip
          - label: macOS SC
            os: macos-latest
            profile: sc
            product: LingoAct
            target: --mac dmg --universal
            artifact: LingoAct.dmg
          - label: Windows Huayu
            os: windows-latest
            profile: huayu
            product: LingoAct-Huayu
            target: --win zip --x64
            artifact: LingoAct-Huayu.zip
          - label: Windows Full
            os: windows-latest
            profile: full
            product: LingoAct
            target: --win zip --x64
            artifact: LingoAct-Full.zip
          - label: Windows English
            os: windows-latest
            profile: english
            product: LingoAct-English
            target: --win zip --x64
            artifact: LingoAct-English.zip
          - label: Windows Guoyu
            os: windows-latest
            profile: guoyu
            product: LingoAct-Guoyu
            target: --win zip --x64
            artifact: LingoAct-Guoyu.zip
          - label: Windows NCACLS
            os: windows-latest
            profile: ncacls
            product: LingoAct-NCACLS
            target: --win zip --x64
            artifact: LingoAct-NCACLS.zip
          - label: macOS Huayu
            os: macos-latest
            profile: huayu
            product: LingoAct-Huayu
            target: --mac dmg --universal
            artifact: LingoAct-Huayu.dmg
          - label: macOS NCACLS
            os: macos-latest
            profile: ncacls
            product: LingoAct-NCACLS
            target: --mac dmg --universal
            artifact: LingoAct-NCACLS.dmg
    steps:
      - name: Checkout
        if: github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        if: github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          # In step with the workflows and Cloudflare Pages: this repository's
          # lockfile is a pnpm 11 one.
          version: 11.7.0

      - name: Setup Node
        if: github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest'
        run: pnpm install --frozen-lockfile

      # 17 MB of binary deliberately kept out of git, and named in
      # extraResources — so without this the packaging step fails outright
      # looking for resources/fonts, and it is the注音 every Chinese class uses.
      - name: Fetch the Bopomofo font
        if: github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest'
        run: node scripts/fetch-bopomofo-font.mjs

      # pnpm lint starts with tsc -b and runs the schema checks. The schema ones
      # matter most here: the whole of schema.sql is handed to Postgres as one
      # transaction, so a single fault anywhere in it leaves whoever downloads
      # this with a project that has no tables and a setup screen that only says
      # 建立資料表失敗.
      - name: Lint, typecheck and check the schema
        if: github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest'
        run: pnpm lint

      # Deliberately built with no Supabase project configured: whoever downloads
      # this enters their own on first launch. Baking one in would send every
      # class to that project and bill its owner for everyone's AI usage.
      - name: Build
        if: github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest'
        run: pnpm build

      # The build above is only credential-free because no .env reaches the runner.
      # Check the bundle rather than trust that, so a committed .env fails the
      # release instead of shipping one person's project to everyone who downloads it.
      - name: Verify no project is baked in
        if: github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest'
        shell: bash
        run: |
          # Matches a real key, not the setup screen's own placeholder and
          # validation pattern, which legitimately contain the same prefix.
          if grep -rhoE 'sb_publishable_[A-Za-z0-9_-]{20,}' dist/assets | grep -q .; then
            echo "::error::A Supabase publishable key is embedded in the build. Refusing to publish."
            grep -rhoE 'sb_publishable_[A-Za-z0-9_-]{20,}' dist/assets | sed 's/\(.\{22\}\).*/\1.../' | sort -u
            exit 1
          fi
          echo "No Supabase project embedded."

      # One profile per job, as in InterAct's known-good Mac build. Building
      # Huayu and then NCACLS in the same release/mac-universal directory meant
      # only the second app was ever inspected; a bad Huayu DMG could therefore
      # be published beside a perfectly valid NCACLS one.
      - name: Package ${{ matrix.product }}
        if: github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest'
        shell: bash
        env:
          APP_PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.target }}
          VITE_APP_PROFILE: ${{ matrix.profile }}
        run: |
          pnpm build
          pnpm exec electron-builder $TARGET --publish never

      - name: Distinguish the full edition download
        if: matrix.profile == 'full' && (github.event_name == 'push' || inputs.platform == 'all')
        shell: bash
        run: mv release/LingoAct.zip release/LingoAct-Full.zip

      - name: Verify the Windows app starts
        if: matrix.os == 'windows-latest' && (github.event_name == 'push' || inputs.platform == 'all')
        env:
          PRODUCT: ${{ matrix.product }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          import assert from 'node:assert/strict'
          const output = execFileSync(`release/win-unpacked/${process.env.PRODUCT}.exe`, ['--smoke-test'], { encoding: 'utf8', timeout: 30000, windowsHide: true })
          assert.match(output, /LINGOACT_SMOKE_TEST_OK/)
          console.log(output)
          JS

      # Check the exact app and image this job uploads. Besides the signature,
      # invoking --version makes macOS load the universal executable; lipo by
      # itself only proves both slices exist, not that the kernel accepts them.
      - name: Verify the Mac app and DMG
        if: matrix.os == 'macos-latest' && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'mac')
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          app="release/mac-universal/$PRODUCT.app"
          dmg="release/$PRODUCT.dmg"
          codesign --display --verbose=2 "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "Architectures:"
          archs=$(lipo -archs "$app/Contents/MacOS/$PRODUCT")
          echo "$archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          # An Electron app owns --version itself and may enter its GUI loop.
          # Node mode still makes macOS load this exact universal Mach-O, then
          # exits deterministically after proving the embedded runtime starts.
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/$PRODUCT" -e \
            'console.log(`Electron runtime: ${process.versions.electron}; arch: ${process.arch}`)'
          # Node mode proves the Mach-O starts but deliberately skips
          # electron/main.cjs. Launch the packaged application as Electron too:
          # this caught the Windows-only BrowserWindow.setAppDetails call that
          # made both v1.0.5 DMGs pass packaging and then crash on a real Mac.
          "$app/Contents/MacOS/$PRODUCT" --smoke-test
          hdiutil verify "$dmg"
          # Without these two strings macOS denies the microphone and the screen
          # outright, and the app looks broken rather than unapproved.
          # PlistBuddy exits non-zero on a missing key, so a dropped extendInfo
          # fails here instead of on someone's Mac.
          echo "Usage descriptions:"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSScreenCaptureUsageDescription' "$app/Contents/Info.plist"

      - name: Upload build
        if: github.event_name == 'push' || inputs.platform == 'all' || matrix.os == 'macos-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.label }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    # Pushing a tag publishes, as before. A manual run defaults to building
    # only, so an unsigned Mac build can be downloaded and actually opened on a
    # Mac before it goes onto the public release page.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: builds
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          (cd builds && shopt -s nullglob && sha256sum -- *.zip *.dmg > SHA256SUMS.txt)
          notes=$(cat <<'MD'
          ## 下載

          | 版本 | Windows | macOS |
          |---|---|---|
          | LingoAct 簡體中文／HSK 版 | `LingoAct.zip` | `LingoAct.dmg` |
          | 華語教學版（預設繁體，可選簡體或 English） | `LingoAct-Huayu.zip` | `LingoAct-Huayu.dmg` |
          | 完整教學版 | `LingoAct-Full.zip` | — |
          | 英語教學版 | `LingoAct-English.zip` | — |
          | 國語教學版 | `LingoAct-Guoyu.zip` | — |
          | 全美中文學校聯合總會版 | `LingoAct-NCACLS.zip` | `LingoAct-NCACLS.dmg` |

          **Windows：** 解壓縮後執行裡面的 exe。
          **macOS：** 開啟 dmg，把 App 拖進「應用程式」。同一個檔案支援 Apple Silicon 與 Intel。

          ## 本次更新

          - 華語教學版加入簡體／HSK 模式，預設仍是繁體；English 可選 HSK、TOCFL 或 TBCL。
          - 簡體版固定使用簡體中文、HSK 與普通話。
          - 看圖說寫同步派送建議詞彙與句型；學生切換外語介面時，題目和建議保留教學原文。
          - 修正看圖說寫 AI 的簡體設定，以及慢速載入導致題目一直停在「出題中」的問題。
          - 中文字型跟隨教師的簡繁設定，補上按需多語說明翻譯及瀏覽器整頁翻譯防護。
          - 支援同資料夾 `.env` 隨身設定；更新時請保留自己的 `.env`。下載包只附 `.env.example`。
          - 首頁授權連結改為公開的教學與授權頁：https://lingoact.ehuayu.org/about。

          `SHA256SUMS.txt` 提供下載檔案的 SHA-256 校驗值。

          ## 首次使用

          開啟後會出現設定畫面，填入你自己的 Supabase 專案（專案識別碼與 publishable key），
          再展開「還沒建立後端？讓 LingoAct 幫你部署」，按一次自動部署就會建好資料表與 AI 功能。

          學員端網址留空就好 —— QR Code 會自動帶上你的專案，課堂資料只會進你自己的 Supabase。

          尚未建立 Supabase 專案，可直接依程式內的部署精靈操作。

          ## 注意

          執行檔未經程式碼簽章。Windows SmartScreen 可能顯示「不明發行者」，
          請點「其他資訊 → 仍要執行」；macOS 第一次開啟請在「系統設定 → 隱私權與安全性」按「仍要開啟」。
          部分公司電腦的資安政策可能直接封鎖。

          個人與教育用途免費；補習班、企業內訓與收費課程屬商業用途，
          使用教學與完整授權：https://lingoact.ehuayu.org/about。
          MD
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A same-version rebuild is intentional: replace only the assets
            # produced by this run and leave the other platform untouched.
            gh release upload "$TAG" builds/* --clobber
          else
            gh release create "$TAG" \
              --title "LingoAct $TAG" \
              --notes "$notes" \
              builds/*
          fi
