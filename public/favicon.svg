<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="LingoAct">
  <title>LingoAct</title>
  <!--
    Two speech bubbles in conversation: the upper one carries horizontal rules,
    the lower one vertical ones. Horizontal against vertical is the difference
    between the writing systems this app's teachers work across, and it is the
    one detail here that no general classroom tool would have. It also survives
    being 16px wide, which a letterform would not, and needs no font installed
    on the machine that renders it.
  -->
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a3468"/>
      <stop offset="1" stop-color="#5c2046"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#badge)"/>

  <g transform="translate(256 256) scale(1.15) translate(-256 -256)">

  <!-- Back bubble: the language being explained in. -->
  <g fill="#fdeaf2">
    <path d="M124 96h114a48 48 0 0 1 48 48v72a48 48 0 0 1-48 48h-70l-52 56a8 8 0 0 1-13.86-5.46V262.5A48 48 0 0 1 76 216v-72a48 48 0 0 1 48-48z"/>
  </g>
  <g fill="#7b2d5e">
    <rect x="112" y="136" width="138" height="17" rx="8.5"/>
    <rect x="112" y="170" width="138" height="17" rx="8.5"/>
    <rect x="112" y="204" width="92" height="17" rx="8.5"/>
  </g>

  <!-- Front bubble: the language being taught. Outlined in the badge colour so
       it reads as sitting in front rather than merging with the one behind. -->
  <g>
    <path
      d="M274 214h114a48 48 0 0 1 48 48v72a48 48 0 0 1-48 48v41.04a8 8 0 0 1-13.86 5.46l-52-56h-48a48 48 0 0 1-48-48v-72a48 48 0 0 1 48-48z"
      fill="#ffffff" stroke="#6b2653" stroke-width="16"/>
  </g>
  <g fill="#7b2d5e">
    <rect x="281" y="253" width="17" height="90" rx="8.5"/>
    <rect x="323" y="253" width="17" height="90" rx="8.5"/>
    <rect x="365" y="253" width="17" height="62" rx="8.5"/>
  </g>
  </g>
</svg>
